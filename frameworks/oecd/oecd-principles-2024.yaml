status: "ACTIVE"
controls:
  - external_identifier: "OECD-P1.1"
    parent_identifier: null
    title: "Inclusive growth, sustainable development, and well-being"
    description: "Stakeholders should proactively engage in responsible stewardship of trustworthy AI in pursuit of beneficial outcomes for people and the planet, such as augmenting human capabilities and enhancing creativity, advancing inclusion of underrepresented populations, reducing economic, social, gender and other inequalities, and protecting the natural environment, thereby invigorating inclusive growth, sustainable development and well-being."
    control_level: "PRINCIPLE"
    framework_function: null
    category: null
    subcategory: null
    article_number: null
    effective_date: "2024-05-03"
    applicability_notes: "Applies to impacts on economic equity, employment opportunities, environmental sustainability, and social inclusion."
    source_locator: "OECD/LEGAL/0449 Section 1.1"
    status: "ACTIVE"
    metadata:
      principle_number: "1.1"

  - external_identifier: "OECD-P1.2"
    parent_identifier: null
    title: "Human rights and democratic values, including fairness and privacy"
    description: "AI actors should respect the rule of law, human rights and democratic values, throughout the AI system lifecycle. These include freedom, dignity and autonomy, privacy and data protection, non-discrimination and equality, diversity, fairness, social justice, and internationally recognised labour rights."
    control_level: "PRINCIPLE"
    framework_function: null
    category: null
    subcategory: null
    article_number: null
    effective_date: "2024-05-03"
    applicability_notes: "Directly implicated in discrimination, bias, unauthorized surveillance, and human rights deprivations."
    source_locator: "OECD/LEGAL/0449 Section 1.2"
    status: "ACTIVE"
    metadata:
      principle_number: "1.2"

  - external_identifier: "OECD-P1.3"
    parent_identifier: null
    title: "Transparency and explainability"
    description: "AI Actors should commit to transparency and responsible disclosure regarding AI systems. To this end, they should provide meaningful information, appropriate to the context, and consistent with the state of art to foster a general understanding of AI systems, make stakeholders aware of their interactions with AI systems, enable those affected by an AI system to understand the outcome, and enable those adversely affected to contest its outcome."
    control_level: "PRINCIPLE"
    framework_function: null
    category: null
    subcategory: null
    article_number: null
    effective_date: "2024-05-03"
    applicability_notes: "Implicated in lack of disclosure, opaque decision-making, and absence of explanation or contestability."
    source_locator: "OECD/LEGAL/0449 Section 1.3"
    status: "ACTIVE"
    metadata:
      principle_number: "1.3"

  - external_identifier: "OECD-P1.4"
    parent_identifier: null
    title: "Robustness, security, and safety"
    description: "AI systems should be robust, secure and safe throughout their entire lifecycle so that, in conditions of normal use, foreseeable use or misuse, or other adverse conditions, they function appropriately and do not pose unreasonable safety risk. To this end, AI actors should ensure traceability, including in relation to datasets, processes and decisions made during the AI system lifecycle."
    control_level: "PRINCIPLE"
    framework_function: null
    category: null
    subcategory: null
    article_number: null
    effective_date: "2024-05-03"
    applicability_notes: "Directly implicated in safety incidents, cyber vulnerabilities, model hallucinations causing harm, and adversarial attacks."
    source_locator: "OECD/LEGAL/0449 Section 1.4"
    status: "ACTIVE"
    metadata:
      principle_number: "1.4"

  - external_identifier: "OECD-P1.5"
    parent_identifier: null
    title: "Accountability"
    description: "AI actors should be accountable for the proper functioning of AI systems and for the respect of the above principles, based on their roles, the context, and consistent with the state of art."
    control_level: "PRINCIPLE"
    framework_function: null
    category: null
    subcategory: null
    article_number: null
    effective_date: "2024-05-03"
    applicability_notes: "Implicated where organizational governance, remediation, or oversight mechanisms failed."
    source_locator: "OECD/LEGAL/0449 Section 1.5"
    status: "ACTIVE"
    metadata:
      principle_number: "1.5"
