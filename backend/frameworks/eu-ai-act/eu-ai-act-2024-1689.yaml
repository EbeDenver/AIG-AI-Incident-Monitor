    status: "ACTIVE"
    metadata:
      article_ref: "5(1)(g)"

  - external_identifier: "EU-ART-5.1.h"
    parent_identifier: "EU-ART-5"
    title: "Real-Time Remote Biometric Identification in Public Spaces"
    description: "The use of real-time remote biometric identification systems in publicly accessible spaces for law enforcement purposes, subject to narrow statutory exceptions."
    control_level: "ARTICLE"
    framework_function: null
    category: null
    subcategory: null
    article_number: "Article 5(1)(h)"
    effective_date: "2025-02-02"
    applicability_notes: "Screening criterion for live public facial recognition deployments."
    source_locator: "Regulation (EU) 2024/1689, Article 5(1)(h)"
    status: "ACTIVE"
    metadata:
      article_ref: "5(1)(h)"

