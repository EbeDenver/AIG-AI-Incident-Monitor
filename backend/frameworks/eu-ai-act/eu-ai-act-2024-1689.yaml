  # Transparency Obligations (Article 50)
  - external_identifier: "EU-ART-50"
    parent_identifier: null
    title: "Transparency Obligations for Certain AI Systems"
    description: "Transparency obligations for providers and deployers of AI systems interacting with natural persons, generating synthetic media, or publishing text on matters of public interest."
    control_level: "ARTICLE"
    framework_function: null
    category: null
    subcategory: null
    article_number: "Article 50"
    effective_date: "2026-08-02"
    applicability_notes: "Parent classification for general transparency duties."
    source_locator: "Regulation (EU) 2024/1689, Article 50"
    status: "ACTIVE"
    metadata:
      article_ref: "50"

  - external_identifier: "EU-ART-50.1"
    parent_identifier: "EU-ART-50"
    title: "Notification of AI Interaction"
    description: "Providers shall ensure that AI systems intended to interact directly with natural persons are designed and developed in such a way that the natural persons are informed that they are interacting with an AI system."
    control_level: "ARTICLE"
    framework_function: null
    category: null
    subcategory: null
    article_number: "Article 50(1)"
    effective_date: "2026-08-02"
    applicability_notes: "Screening criterion for conversational agents, customer service bots, and synthetic avatars."
    source_locator: "Regulation (EU) 2024/1689, Article 50(1)"
    status: "ACTIVE"
    metadata:
      article_ref: "50(1)"

  - external_identifier: "EU-ART-50.2"
    parent_identifier: "EU-ART-50"
    title: "Labeling of Synthetic Media and Deepfakes"
    description: "Providers and deployers of an AI system that generates or manipulates image, audio or video content constituting a deep fake shall disclose that the content has been artificially generated or manipulated."
    control_level: "ARTICLE"
    framework_function: null
    category: null
    subcategory: null
    article_number: "Article 50(2)"
    effective_date: "2026-08-02"
    applicability_notes: "Screening criterion for synthetic voice, cloned likeness, and deepfake generation."
    source_locator: "Regulation (EU) 2024/1689, Article 50(2)"
    status: "ACTIVE"
    metadata:
      article_ref: "50(2)"

  - external_identifier: "EU-ART-50.4"
    parent_identifier: "EU-ART-50"
    title: "Disclosure of AI-Generated Public Text"
    description: "Deployers of an AI system that generates or manipulates text published with the purpose of informing the public on matters of public interest shall disclose that the text has been artificially generated or manipulated."
    control_level: "ARTICLE"
    framework_function: null
    category: null
    subcategory: null
    article_number: "Article 50(4)"
    effective_date: "2026-08-02"
    applicability_notes: "Screening criterion for automated news articles and public informational publications."
    source_locator: "Regulation (EU) 2024/1689, Article 50(4)"
    status: "ACTIVE"
    metadata:
      article_ref: "50(4)"

