controls:
  # Foundational Scope & Definitions
  - external_identifier: "EU-ART-2"
    parent_identifier: null
    title: "Scope and Territorial Nexus"
    description: "Statutory scope applying to providers placing on the market or putting into service AI systems in the Union, deployers located within the Union, and providers or deployers located in a third country where output produced by the system is used in the Union."
    control_level: "ARTICLE"
    framework_function: null
    category: null
    subcategory: null
    article_number: "Article 2"
    effective_date: "2026-08-02"
    applicability_notes: "Evaluates territorial or market nexus predicates required for statutory applicability."
    source_locator: "Regulation (EU) 2024/1689, Article 2"
    status: "ACTIVE"
    metadata:
      article_ref: "2"

  - external_identifier: "EU-ART-3.1"
    parent_identifier: null
    title: "AI System Definition"
    description: "A machine-based system designed to operate with varying levels of autonomy and that may exhibit adaptiveness after deployment, and that, for explicit or implicit objectives, infers, from the input it receives, how to generate outputs such as predictions, content, recommendations, or decisions that can influence physical or virtual environments."
    control_level: "ARTICLE"
    framework_function: null
    category: null
    subcategory: null
    article_number: "Article 3(1)"
    effective_date: "2025-02-02"
    applicability_notes: "Evaluates whether the technology meets the statutory definition of an AI system."
    source_locator: "Regulation (EU) 2024/1689, Article 3(1)"
    status: "ACTIVE"
    metadata:
      article_ref: "3(1)"

  - external_identifier: "EU-ART-3.49"
    parent_identifier: null
    title: "Serious Incident Definition"
    description: "An incident or malfunctioning of an AI system that directly or indirectly leads to the death of a person or serious damage to health, serious and irreversible disruption of the management or operation of critical infrastructure, infringement of fundamental rights obligations under Union law, or serious damage to property or the environment."
    control_level: "ARTICLE"
    framework_function: null
    category: null
    subcategory: null
    article_number: "Article 3(49)"
    effective_date: "2026-08-02"
    applicability_notes: "Evaluates conceptual correspondence to serious incident harm thresholds."
    source_locator: "Regulation (EU) 2024/1689, Article 3(49)"
    status: "ACTIVE"
    metadata:
      article_ref: "3(49)"

  # Prohibited AI Practices (Article 5)
  - external_identifier: "EU-ART-5"
    parent_identifier: null
    title: "Prohibited AI Practices"
    description: "Practices involving AI systems that are unacceptable as contravening Union values, such as violating fundamental rights."
    control_level: "ARTICLE"
    framework_function: null
    category: null
    subcategory: null
    article_number: "Article 5"
    effective_date: "2025-02-02"
    applicability_notes: "Article 5 parent classification covering prohibited practices."
    source_locator: "Regulation (EU) 2024/1689, Article 5"
    status: "ACTIVE"
    metadata:
      article_ref: "5"

  - external_identifier: "EU-ART-5.1.a"
    parent_identifier: "EU-ART-5"
    title: "Subliminal, Manipulative, or Deceptive Techniques"
    description: "AI systems deploying subliminal techniques beyond a person's consciousness or purposeful manipulative or deceptive techniques to materially distort behavior and impair informed decision-making causing significant harm."
    control_level: "ARTICLE"
    framework_function: null
    category: null
    subcategory: null
    article_number: "Article 5(1)(a)"
    effective_date: "2025-02-02"
    applicability_notes: "Screening criterion for cognitive manipulation and behavioral distortion."
    source_locator: "Regulation (EU) 2024/1689, Article 5(1)(a)"
    status: "ACTIVE"
    metadata:
      article_ref: "5(1)(a)"

  - external_identifier: "EU-ART-5.1.b"
    parent_identifier: "EU-ART-5"
    title: "Exploitation of Vulnerabilities"
    description: "AI systems that exploit vulnerabilities of a natural person or specific group due to age, disability, or specific social or economic situation to materially distort behavior causing significant harm."
    control_level: "ARTICLE"
    framework_function: null
    category: null
    subcategory: null
    article_number: "Article 5(1)(b)"
    effective_date: "2025-02-02"
    applicability_notes: "Screening criterion for exploitation of children, disabled individuals, or distressed populations."
    source_locator: "Regulation (EU) 2024/1689, Article 5(1)(b)"
    status: "ACTIVE"
    metadata:
      article_ref: "5(1)(b)"

  - external_identifier: "EU-ART-5.1.c"
    parent_identifier: "EU-ART-5"
    title: "Social Scoring"
    description: "AI systems evaluating or classifying natural persons or groups based on their social behaviour or known, inferred, or predicted personal characteristics leading to detrimental or unfavourable treatment."
    control_level: "ARTICLE"
    framework_function: null
    category: null
    subcategory: null
    article_number: "Article 5(1)(c)"
    effective_date: "2025-02-02"
    applicability_notes: "Screening criterion for general-purpose social credit or cross-context behavioral scoring."
    source_locator: "Regulation (EU) 2024/1689, Article 5(1)(c)"
    status: "ACTIVE"
    metadata:
      article_ref: "5(1)(c)"

  - external_identifier: "EU-ART-5.1.d"
    parent_identifier: "EU-ART-5"
    title: "Predictive Policing / Criminal Offence Profiling"
    description: "AI systems making risk assessments of natural persons in order to assess or predict the likelihood of a natural person committing a criminal offence based solely on profiling or personality traits."
    control_level: "ARTICLE"
    framework_function: null
    category: null
    subcategory: null
    article_number: "Article 5(1)(d)"
    effective_date: "2025-02-02"
    applicability_notes: "Screening criterion for individual recidivism or criminal profiling algorithms."
    source_locator: "Regulation (EU) 2024/1689, Article 5(1)(d)"
    status: "ACTIVE"
    metadata:
      article_ref: "5(1)(d)"

  - external_identifier: "EU-ART-5.1.e"
    parent_identifier: "EU-ART-5"
    title: "Untargeted Facial Image Scraping"
    description: "AI systems that create or expand facial recognition databases through the untargeted scraping of facial images from the internet or CCTV footage."
    control_level: "ARTICLE"
    framework_function: null
    category: null
    subcategory: null
    article_number: "Article 5(1)(e)"
    effective_date: "2025-02-02"
    applicability_notes: "Screening criterion for mass facial image harvesting and biometric dataset building."
    source_locator: "Regulation (EU) 2024/1689, Article 5(1)(e)"
    status: "ACTIVE"
    metadata:
      article_ref: "5(1)(e)"

  - external_identifier: "EU-ART-5.1.f"
    parent_identifier: "EU-ART-5"
    title: "Emotion Recognition in Workplace and Education"
    description: "AI systems inferring emotions of a natural person in the workplace and educational institutions, except where intended for medical or safety reasons."
    control_level: "ARTICLE"
    framework_function: null
    category: null
    subcategory: null
    article_number: "Article 5(1)(f)"
    effective_date: "2025-02-02"
    applicability_notes: "Screening criterion for workplace worker surveillance or student emotion analysis."
    source_locator: "Regulation (EU) 2024/1689, Article 5(1)(f)"
    status: "ACTIVE"
    metadata:
      article_ref: "5(1)(f)"

  - external_identifier: "EU-ART-5.1.g"
    parent_identifier: "EU-ART-5"
    title: "Biometric Categorization for Sensitive Traits"
    description: "AI systems for biometric categorization that categorise individually natural persons based on their biometric data to deduce or infer race, political opinions, trade union membership, religious beliefs, sex life or sexual orientation."
